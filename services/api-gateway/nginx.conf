events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';

    access_log /var/log/nginx/access.log main;
    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 10M;

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/m;
    limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;

    # Use Docker's internal DNS — resolves hostnames dynamically (no crash on startup)
    resolver 127.0.0.11 valid=10s ipv6=off;

    server {
        listen 80;
        server_name _;

        # ── Auth routes ─────────────────────────────────────
        location /api/v1/auth/ {
            limit_req zone=auth burst=20 nodelay;
            set $auth_upstream http://auth:8000;
            proxy_pass $auth_upstream/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ── Portfolio routes ─────────────────────────────────
        location /api/v1/portfolio/ {
            limit_req zone=api burst=50 nodelay;
            set $portfolio_upstream http://portfolio:8001;
            proxy_pass $portfolio_upstream/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
        }

        # ── Market data routes ───────────────────────────────
        location /api/v1/market/ {
            limit_req zone=api burst=30 nodelay;
            set $market_upstream http://market-data:8002;
            proxy_pass $market_upstream/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # ── AI Advisor routes ────────────────────────────────
        location /api/v1/ai/ {
            limit_req zone=api burst=20 nodelay;
            set $ai_upstream http://ai-advisor:8003;
            proxy_pass $ai_upstream/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 120s;
            proxy_buffering off;
        }

        # ── Health check ─────────────────────────────────────
        location /health {
            access_log off;
            return 200 '{"status":"ok"}';
            add_header Content-Type application/json;
        }

        # ── Frontend fallback ────────────────────────────────
        location / {
            set $frontend_upstream http://frontend:3000;
            proxy_pass $frontend_upstream;
            proxy_set_header Host $host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}