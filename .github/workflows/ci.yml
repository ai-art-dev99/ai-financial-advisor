name: CI/CD — Robo Advisor

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  AWS_REGION:   us-east-1
  ECR_REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.us-east-1.amazonaws.com
  PROJECT:      robo-advisor

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_pass
          POSTGRES_DB: test_db
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 10s

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Test auth service
        env:
          DATABASE_URL: sqlite+aiosqlite:///:memory:
          REDIS_URL: redis://localhost:6379/0
          JWT_SECRET_KEY: test-secret
        run: |
          pip install -r services/auth/requirements.txt aiosqlite \
            pytest pytest-asyncio httpx asgi-lifespan -q
          cd services/auth && python -m pytest tests/ -v --tb=short

      - name: Test portfolio service
        env:
          DATABASE_URL: sqlite+aiosqlite:///:memory:
          JWT_SECRET_KEY: test-secret
        run: |
          pip install -r services/portfolio/requirements.txt aiosqlite \
            pytest pytest-asyncio httpx asgi-lifespan -q
          cd services/portfolio && python -m pytest tests/ -v --tb=short

      - name: Test ai-advisor service
        env:
          ANTHROPIC_API_KEY: test-key
        run: |
          pip install anthropic chromadb langchain langchain-anthropic \
            langchain-community langchain-chroma feedparser tenacity \
            pytest pytest-asyncio -q
          cd services/ai-advisor && python -m pytest tests/ -v --tb=short

  build:
    name: Build & Push
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    outputs:
      image_tag: ${{ steps.tag.outputs.tag }}
    strategy:
      matrix:
        service: [auth, portfolio, ai-advisor, market-data]

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image tag
        id: tag
        run: echo "tag=${GITHUB_SHA::8}" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push
        uses: docker/build-push-action@v5
        with:
          context: ./services/${{ matrix.service }}
          push: true
          tags: |
            ${{ env.ECR_REGISTRY }}/${{ env.PROJECT }}-${{ matrix.service }}:latest
            ${{ env.ECR_REGISTRY }}/${{ env.PROJECT }}-${{ matrix.service }}:${{ steps.tag.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-services:
    name: Deploy Services
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    environment: production
    strategy:
      matrix:
        service: [auth, portfolio, ai-advisor, market-data]
      max-parallel: 2

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}

      - name: Update task definition
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition-family: ${{ env.PROJECT }}-${{ matrix.service }}
          container-name: ${{ matrix.service }}
          image: ${{ env.ECR_REGISTRY }}/${{ env.PROJECT }}-${{ matrix.service }}:${{ needs.build.outputs.image_tag }}

      - name: Deploy to ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v1
        with:
          task-definition:            ${{ steps.task-def.outputs.task-definition }}
          service:                    ${{ env.PROJECT }}-${{ matrix.service }}
          cluster:                    ${{ env.PROJECT }}-prod
          wait-for-service-stability: true

  deploy-frontend:
    name: Deploy Frontend
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    environment: production

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: services/frontend/package-lock.json

      - name: Build
        working-directory: services/frontend
        env:
          VITE_API_URL: https://${{ secrets.DOMAIN_NAME }}/api/v1
        run: npm ci && npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}

      - name: Sync to S3
        run: |
          aws s3 sync services/frontend/dist/ \
            s3://${{ secrets.FRONTEND_BUCKET }} --delete \
            --cache-control "public, max-age=31536000, immutable" \
            --exclude "index.html"
          aws s3 cp services/frontend/dist/index.html \
            s3://${{ secrets.FRONTEND_BUCKET }}/index.html \
            --cache-control "public, max-age=0, must-revalidate"

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"

  smoke-test:
    name: Smoke Test
    runs-on: ubuntu-latest
    needs: [deploy-services, deploy-frontend]
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Health checks
        run: |
          BASE="https://${{ secrets.DOMAIN_NAME }}"
          for ep in auth/health portfolio/health ai/health market/health; do
            status=$(curl -sf -o /dev/null -w "%{http_code}" "$BASE/api/v1/$ep" || echo "000")
            [ "$status" = "200" ] && echo "OK $BASE/api/v1/$ep" || (echo "FAIL $ep: $status" && exit 1)
          done